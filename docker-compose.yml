version: '3.8'

services:
  bot:
    build: .
    container_name: ignews_bot
    restart: always
    env_file: .env
    command: npm run start:bot
    depends_on:
      - media-renderer

  media-renderer:
    build: ./services/media-renderer
    container_name: ignews_media_renderer
    restart: always
    env_file: .env
    expose:
      - "3000"

  worker:
    build: .
    container_name: ignews_worker
    restart: always
    env_file: .env
    command: npm run start:worker
    depends_on:
      - media-renderer
